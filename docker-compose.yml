services:
  image-hub:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5190:5190"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      # LibTV / Lovart 适配器需要容器内可访问本机的 CLI 与适配脚本。
      # 只有同时使用这两个平台时才需要取消注释，并按你的实际路径调整；
      # 对应的 IMAGE_HUB_LIBTV_CLI / IMAGE_HUB_LOVART_SKILL_SCRIPT 要指向容器内路径。
      # - ${LIBTV_HOME:-$HOME/.libtv}:/opt/libtv:ro
      # - ${LOVART_SKILL_HOME:-$HOME/.lovart}:/opt/lovart:ro
